name: delivery
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: rustwake-databrick-delivery
  cancel-in-progress: false
jobs:
  package:
    # No fork/PR artifact may reach the deployment runner. Enable only after bootstrap.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (vars.RUSTWAKE_CD_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.sha }}
    steps:
      - name: Record immutable source
        id: identity
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/package-dashboard.test.mjs
      - name: Package public dashboard and manifest
        env:
          RUSTWAKE_SOURCE_SHA: ${{ steps.identity.outputs.sha }}
        run: node scripts/package-dashboard.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rustwake-${{ steps.identity.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: package
    runs-on: [self-hosted, Linux, X64, rustwake-deploy]
    environment: rustwake-databrick
    timeout-minutes: 20
    steps:
      # No checkout and no npm on this machine. The host-owned adapter is installed
      # and reviewed during bootstrap, outside repository-writable paths.
      - uses: actions/download-artifact@v4
        with:
          name: rustwake-${{ needs.package.outputs.source_sha }}
          path: ${{ runner.temp }}/rustwake-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate and promote through host-owned adapter
        env:
          RUSTWAKE_GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/rustwake-${{ github.run_id }}-${{ github.run_attempt }}
          RECEIPT_PATH: ${{ runner.temp }}/rustwake-${{ github.run_id }}-${{ github.run_attempt }}-receipt.json
        run: |
          test -x /opt/rustwake-delivery/deploy-artifact.py
          /opt/rustwake-delivery/deploy-artifact.py "$ARTIFACT_DIR" "$SOURCE_SHA" "$RECEIPT_PATH"
      - name: Publish sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustwake-deployment-${{ needs.package.outputs.source_sha }}
          path: ${{ runner.temp }}/rustwake-${{ github.run_id }}-${{ github.run_attempt }}-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Explain delivery outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
        run: |
          printf '### Rustwake delivery\nSource: `%s`\n\nJob result: **%s**. See the receipt artifact for served verification.\n\n[Game](https://home.darkmatter2222.com/rustwake/) · [Team dashboard](https://home.darkmatter2222.com/rustwake/team/)\n' "$SOURCE_SHA" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove downloaded candidate
        if: always()
        env:
          CANDIDATE: ${{ runner.temp }}/rustwake-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$CANDIDATE"
  # OPS-08 (#332): post-promote live proof. Runs ONLY after the trusted deploy
  # succeeded, on a GitHub-hosted runner — repository scripts never execute on
  # the privileged deploy runner. Compares the exact promoted main SHA against
  # the publicly served release-manifest.json and recomputes served entry
  # JS/CSS SHA-256 over plain HTTPS. FAILED/UNKNOWN exits non-zero and fails
  # this delivery run. Hosted-browser smoke remains separate task #333.
  verify-live:
    needs: [package, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record previous-main rollback target
        id: rollback
        run: |
          PREV=$(git rev-parse HEAD^ 2>/dev/null || true)
          echo "sha=$PREV" >> "$GITHUB_OUTPUT"
      - name: Verify served manifest and asset checksums against promoted SHA
        env:
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
          ROLLBACK_SHA: ${{ steps.rollback.outputs.sha }}
          MAIN_CI_RUN: ${{ github.event.workflow_run.html_url || 'workflow_dispatch (no upstream CI run)' }}
          DELIVERY_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/verify-live-release.mjs "$SOURCE_SHA" \
            --rollback-sha "$ROLLBACK_SHA" \
            --main-ci-run "$MAIN_CI_RUN" \
            --delivery-run "$DELIVERY_RUN" \
            --out live-release-proof.json
      - name: Publish live verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustwake-live-verification-${{ needs.package.outputs.source_sha }}
          path: live-release-proof.json
          if-no-files-found: warn
          retention-days: 30
      - name: Explain live verification outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
        run: |
          printf '### Rustwake live release proof (OPS-08)\nSource: `%s`\n\nPublic manifest + served JS/CSS checksum verification: **%s**. See the rustwake-live-verification artifact for the full receipt (rollback target, main CI run, delivery run).\n' "$SOURCE_SHA" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
  # OPS-09 (#333): exactly ONE hosted-browser smoke per deployed SHA. Runs on an
  # UNPRIVILEGED GitHub-hosted runner (repository code never executes on the
  # privileged deploy runner), serialized AFTER the trusted deploy and the
  # OPS-08 numeric live proof. One Chromium instance, sequential fresh desktop
  # (1440x900) and phone-sized (390x844) contexts against the LIVE public site.
  # The workflow-level concurrency group (cancel-in-progress: false) plus the
  # per-SHA job group below guarantee one browser instance per SHA. A FAILED
  # smoke fails this job and the whole delivery run (no continue-on-error):
  # the release stays UNVERIFIED even when the deployment receipt succeeded.
  # The release receipt must cite hosted-browser PASS (artifact
  # rustwake-hosted-browser-<sha>) to retire the PASS_NUMERIC_ONLY caveat.
  hosted-browser:
    needs: [package, deploy, verify-live]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: rustwake-hosted-browser-${{ needs.package.outputs.source_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install one Chromium binary for the hosted live smoke
        run: npx playwright-core install --with-deps chromium
      - name: One serialized hosted Chromium smoke against the live deployed site
        env:
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
        run: node scripts/capture-live.mjs "$SOURCE_SHA"
      - name: Publish hosted-browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustwake-hosted-browser-${{ needs.package.outputs.source_sha }}
          path: artifacts/live-smoke/
          if-no-files-found: warn
          retention-days: 30
      - name: Explain hosted-browser outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
        run: |
          printf '### Rustwake hosted-browser smoke (OPS-09)\nSource: `%s`\n\nOne GitHub-hosted Chromium, sequential desktop + emulated phone contexts against the live site: **%s**. A failed smoke leaves this release UNVERIFIED even if the deploy receipt succeeded; the release comment must cite hosted-browser PASS from the rustwake-hosted-browser artifact.\n' "$SOURCE_SHA" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
