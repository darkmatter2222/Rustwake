name: ci
on:
  push:
    branches: [main, 'rw/**']
  pull_request:
jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            src
            scripts
            tests
            public
            package.json
            package-lock.json
            index.html
            vite.config.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: node --test scripts/package-dashboard.test.mjs
