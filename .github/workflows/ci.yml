name: ci
on:
  push:
    branches: [main, 'rw/**']
  pull_request:
# OPS-12 (#336): explicit least privilege. PR code runs here UNPRIVILEGED;
# the job only reads source (checkout) — npm cache and artifact upload use the
# runtime token, not GITHUB_TOKEN scopes. Never grant write to this workflow.
permissions:
  contents: read
jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            .github
            .qwen
            .opencode
            docs
            AGENTS.md
            QWEN.md
            goal.md
            src
            scripts
            tests
            public
            package.json
            package-lock.json
            index.html
            vite.config.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: node scripts/check-studio-docs.mjs
      - run: node scripts/check-design-contract.mjs
      - run: node scripts/check-city-manifest.mjs
      - run: node --check scripts/bootstrap-v2-city-project.mjs
      - run: node scripts/bootstrap-v2-city-project.mjs
      - run: npm run build
      - name: Install one Chromium binary for PR visual smoke
        if: github.event_name == 'pull_request'
        run: npx playwright-core install --with-deps chromium
      - name: Capture the actual V2 production build on desktop and phone
        if: github.event_name == 'pull_request'
        run: node scripts/capture-v2.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.event_name == 'pull_request'
        with:
          name: rustwake-v2-visual-preview
          path: artifacts/v2-preview/
          if-no-files-found: warn
          retention-days: 14
      - run: node --test scripts/package-dashboard.test.mjs
