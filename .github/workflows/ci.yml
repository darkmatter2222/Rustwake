name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/team-board.mjs --check
      - run: node --test scripts/team-board.test.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run build

