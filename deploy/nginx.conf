# Install in the Rustwake-owned nginx service only. Existing ingress strips /rustwake/.
server {
    listen 8080;
    server_name _;
    root /srv/rustwake-delivery/current;
    index index.html;
    open_file_cache off;
    absolute_redirect off;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location ^~ /assets/ {
        alias /srv/rustwake-delivery/assets/;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }
    location ^~ /team/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
