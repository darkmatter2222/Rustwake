<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1220" />
    <!-- DEF-002 (PLAY-002 g1 QA note b): an inline icon so the tab never falls
         back to a /favicon.ico request the static route can only answer with the
         SPA document. Amber square on the night background, no extra byte fetched. -->

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b1220'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23ffb765'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Rustwake - a full-screen mobile browser idle salvage game."
    />
    <title>Rustwake</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
