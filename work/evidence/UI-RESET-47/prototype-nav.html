<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rustwake UI-RESET #47 navigation prototype</title>
<style>
:root{--night:#0b1220;--well:#0e1726;--panel:rgba(11,18,32,.92);--paper:#f4f7fb;--cyan:#5fd8e8;--amber:#ffb765;--rust:#c9713a;--steel:#6f93ad;--floor:#22384a;--radius:10px;--ts:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--paper);font:calc(15px * var(--ts)) ui-monospace,Consolas,monospace}
.shell{display:grid;height:100%;gap:6px;padding:8px;grid-template-columns:minmax(0,1fr);grid-template-rows:44px auto auto 1fr 46px 44px;grid-template-areas:"band" "card" "insp" "world" "action" "nav"}
#nav{grid-area:nav;display:flex;gap:6px}
#band{grid-area:band;display:flex;gap:4px;align-items:center}
#card{grid-area:card;min-height:0}
#world{grid-area:world;position:relative;min-height:0;overflow:hidden;background:var(--well)}
#insp{grid-area:insp;min-width:0}
#action{grid-area:action;display:flex;gap:6px}
@media (min-width:600px){.shell{max-width:1600px;margin:0 auto;grid-template-columns:96px minmax(0,1fr) auto;grid-template-rows:44px auto 1fr 46px;grid-template-areas:"rail band band" "rail card card" "rail world insp" "rail action insp"}#nav{flex-direction:column;grid-area:rail}#insp{width:320px}#card{min-height:30px}}
.chips{display:flex;gap:4px;flex:1;min-width:0;overflow:hidden}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--panel);border-radius:var(--radius);padding:2px 6px;font-size:.84em;white-space:nowrap}
.cluster{display:flex;gap:4px}
.f{min-height:44px;border-radius:var(--radius);background:var(--panel);color:var(--paper);border:1px solid var(--floor);display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;padding:2px 6px;cursor:pointer}
.f>span{line-height:1.15}
.f .c{font-size:.8em;color:var(--cyan)}
.f--p{background:var(--amber);color:var(--night);border-color:var(--amber)}
.f--p .c{color:var(--night)}
.f[disabled],.f[aria-disabled="true"]{opacity:.55;border-style:dashed}
.f--on{border-color:var(--cyan)}
.f .lk{font-size:.76em;color:var(--steel)}
.card{border-left:3px solid var(--cyan);background:var(--panel);border-radius:var(--radius);padding:4px 8px;display:flex;flex-direction:column}
.card .p{font-weight:700}
.card .s{font-size:.82em;color:var(--steel)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.zr{position:absolute;left:6px;bottom:6px;display:flex;gap:4px}
.zr .f{min-height:44px;min-width:44px}
.toast{position:absolute;right:6px;bottom:6px;background:var(--panel);border:1px solid var(--floor);border-radius:var(--radius);padding:4px 8px;font-size:.86em}
.toast[hidden]{display:none}
.body{background:var(--panel);border:1px solid var(--floor);border-radius:var(--radius);padding:6px;overflow:auto}
.body h2{font-size:1em;margin:0 0 4px}
.body h3{font-size:.92em;margin:6px 0 2px}
.rows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;font-size:.86em}
.rows b{font-weight:700;color:var(--paper)}.rows i{font-style:normal;color:var(--steel)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
@media (min-width:600px){.grid2{grid-template-columns:repeat(3,minmax(0,1fr))}}
.faces{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.faces .f{flex:1;min-width:120px}
.fill{height:6px;background:var(--floor);border-radius:3px;overflow:hidden;margin:2px 0;pointer-events:none}
.fill>i{display:block;height:100%;background:var(--cyan);pointer-events:none}
.alert{border-left:3px solid var(--rust);padding:2px 6px;font-size:.84em;margin:4px 0}
textarea{width:100%;min-height:64px;background:var(--well);color:var(--paper);border:1px solid var(--floor);border-radius:var(--radius);font:.82em ui-monospace,Consolas,monospace}
.empty{font-size:.86em;color:var(--steel)}
@media (max-height:660px){.body{max-height:46vh}}
@media (prefers-reduced-motion: reduce){.f{transition:none}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <nav id="nav" role="navigation" aria-label="Destinations"></nav>
  <div id="band" class="band"></div>
  <div id="card" class="card"></div>
  <div id="insp"></div>
  <div id="world"><canvas id="cv"></canvas><div class="zr" id="zr"></div><div class="toast" id="toast" role="status" hidden></div></div>
  <div id="action" class="action"></div>
</div>
<script>
var U = { mid: "\u00b7", arr: "\u2192" };
var HAND = {}; var S = {};
var MACH = [
  { id: 1, n: "Scrap sorter", tile: 0, lvl: 14, cyc: "1.74s", rate: "0.00", max: "0.57", pw: "1 unit", need: "2 Scrap", next: "Storage is full at 100%. Sell a surplus in the yard store to free room.", up: "1.74s \u2192 1.67s", price: 222 },
  { id: 2, n: "Furnace", tile: 1, lvl: 13, cyc: "1.82s", rate: "0.00", max: "0.55", pw: "2 units", need: "1 Ferrous", next: "Storage is full at 100%. Sell a surplus in the yard store to free room.", up: "1.82s \u2192 1.75s", price: 238 },
  { id: 3, n: "Polymer recycler", tile: 3, lvl: 11, cyc: "3.00s", rate: "0.03", max: "0.33", pw: "1 unit", need: "1 Residue, 1 Copper", next: "Waiting on the copper separator.", up: "3.00s \u2192 2.87s", price: 190 },
  { id: 4, n: "Copper separator", tile: 4, lvl: 12, cyc: "2.38s", rate: "0.04", max: "0.42", pw: "2 units", need: "1 Nonferrous", next: "Output waiting; the link is 97% busy.", up: "2.38s \u2192 2.28s", price: 204 },
  { id: 5, n: "Wire mill", tile: 5, lvl: 11, cyc: "2.00s", rate: "0.05", max: "0.50", pw: "2 units", need: "1 Copper", next: "Waiting on the store feed.", up: "2.00s \u2192 1.92s", price: 198 },
  { id: 6, n: "Plate press", tile: 6, lvl: 10, cyc: "2.63s", rate: "0.04", max: "0.38", pw: "3 units", need: "1 Steel", next: "Waiting on the furnace.", up: "2.63s \u2192 2.53s", price: 216 },
  { id: 7, n: "Circuit assembler", tile: 7, lvl: 10, cyc: "4.21s", rate: "0.02", max: "0.24", pw: "3 units", need: "1 Wire, 1 Polymer", next: "Waiting on the wire mill.", up: "4.21s \u2192 4.04s", price: 230 },
  { id: 8, n: "Signal lab", tile: 8, lvl: 10, cyc: "7.89s", rate: "0.01", max: "0.13", pw: "2 units", need: "1 Circuits", next: "Waiting on the circuit assembler.", up: "7.89s \u2192 7.56s", price: 244 },
];
var STORE_M = [ ["Scrap",10], ["Nonferrous",239], ["Ferrous",54], ["Steel",10], ["Copper",10], ["Polymer",10], ["Wire",72], ["Plates",348], ["Circuits",45], ["Data",102] ];
var SELL_M = { Nonferrous: [60,120], Ferrous: [35,70], Wire: [60,240], Plates: [60,900], Circuits: [27,810], Data: [60,300] };
var NODES = [ ["Efficient Cutters","One cutting pulse gives 7 scrap instead of 5.",4], ["Smart Buffers","Every machine holds 6 more units of input, so short gaps do not halt it.",8], ["Route Dispatch","A newly connected link carries 8 more units at once.",12] ];
function seed(n){ if (n === "mature") { return { tutorial: 9, scrap: 10, credits: 82, storeUnits: 900, capacity: 900, data: 102, drone: true, pulses: 6, overflow: 35, power: "0 of 8 units requested", busy: "97% busy (3/24 in transit)", rows: STORE_M.map(function(r){ return [r[0], r[1]]; }), machines: MACH.map(function(m){ return Object.assign({}, m); }), known: [0,1,2], tick: 450330, links: 18 }; } return { tutorial: 0, scrap: 0, credits: 0, storeUnits: 0, capacity: 900, data: 0, drone: false, pulses: 0, overflow: 0, power: "0 of 8 units requested", busy: "0% busy (0/24 in transit)", rows: [], machines: [], known: [], tick: 0, links: 0 }; }
function boot(n){ S.data = seed(n); S.dest = "yard"; S.stack = []; S.hist = 0; S.machine = null; S.sub = 0; S.blueprint = null; S.ghost = 8; S.pressed = 0; S.log = []; S.toast = null; S.importText = ""; S.importError = null; S.importPage = false; S.report = false; S.showAll = false; S.started = n !== "gate"; S.zoom = 1.6; S.settings = { muted: false, textScale: 1, reducedMotion: false }; render(); }
var QD = String.fromCharCode(34), QA = String.fromCharCode(39);
function el(id){ return document.getElementById(id); }
function btn(id, v, c, kind, dis, fn){ HAND[id] = fn || null; var cls = "f" + (kind === "p" ? " f--p" : "") + (kind === "on" ? " f--on" : ""); var o = "<button class=" + QD + cls + QD; o += " id=" + QD + id + QD; o += " onclick=" + QA + "RW47.tap(" + QD + id + QD + ")" + QA; o += dis ? " disabled" : ""; o += ">" + "<span>" + v + "</span>"; if (c) { o += "<span class=" + QA + "c" + QA + ">" + c + "</span>"; } o += "</button>"; return o; }
function lock(id, v, why){ HAND[id] = null; var o = "<div class=" + QD + "f" + QD + " id=" + QD + id + QD + " aria-disabled=" + QD + "true" + QD + ">"; o += "<span>" + v + "</span><span class=" + QA + "lk" + QA + ">" + why + "</span></div>"; return o; }
function rows(pairs){ var h = "<div class=" + QA + "rows" + QA + ">"; for (var i = 0; i < pairs.length; i++) { h += "<i>" + pairs[i][0] + "</i><b>" + pairs[i][1] + "</b>"; } return h + "</div>"; }
function bar(v, max){ var p = Math.max(0, Math.min(100, Math.round((v / max) * 100))); return "<span class=" + QA + "fill" + QA + "><i style=" + QA + "width:" + p + "%" + QA + "></i></span>"; }
/* #81 rework: one press = one painted face activated once. A tap on an absent, disabled or locked face is not a press: it is ignored, not counted, and runs no handler. */
function tap(id){ var n = el(id); if (!n || n.disabled || n.getAttribute("aria-disabled") === "true") { return; } S.pressed++; S.lastFace = id; S.log.push({ n: S.pressed, id: id, label: (n.textContent || "").trim() }); var h = HAND[id]; if (h) h(); render(); }
function key(k){ S.pressed++; S.log.push({ n: S.pressed, id: "key-" + k, label: k }); if (k === "Escape") { pop(); } else { render(); } }
function tapCanvas(x, y){ S.pressed++; S.log.push({ n: S.pressed, id: "canvas", label: "world tap" }); var hit = pick(x, y); if (S.blueprint !== null) { if (hit !== null) { S.ghost = 8; } place(); return; } S.machine = hit; render(); }
function pick(x, y){ var box = el("world").getBoundingClientRect(); for (var i = 0; i < S.data.machines.length; i++) { var p = tilePt(S.data.machines[i].tile, box); if (Math.abs(p.x - x) < 26 && Math.abs(p.y - y) < 22) { return S.data.machines[i].id; } } return null; }
function tilePt(tile, box){ var cols = 4, s = Math.min(box.width / 5, box.height / 7); var cx = box.width / 2, cy = box.height / 2 + s; var col = tile % cols, row = Math.floor(tile / cols); return { x: cx + (col - row) * s * 0.95, y: cy + (col + row) * s * 0.55 - s * 1.6 }; }
function flash(t){ S.toast = t; }
function push(id){ S.stack.push({ id: id, ret: S.lastFace || (document.activeElement && document.activeElement.id ? document.activeElement.id : null) }); S.hist = (S.hist || 0) + 1; try { history.pushState({ d: S.stack.length }, ""); } catch (e) { S.hist = S.stack.length; } }
function pop(fromHistory){ var top = S.stack.pop(); var ret = top ? top.ret : null; if (top) { if (top.id.indexOf("dest:") === 0) { S.dest = "yard"; } else if (top.id.indexOf("ent:") === 0) { S.machine = null; } else if (top.id.indexOf("sub:") === 0) { S.sub = 0; } else if (top.id.indexOf("page:") === 0) { S.importPage = false; } } if (!fromHistory && S.hist > 0) { S.hist -= 1; try { S.syncBack = 1; history.back(); } catch (e) { } } render(); if (ret && el(ret)) { try { el(ret).focus(); } catch (e) { } } }
function go(dest){ if (S.dest === dest) { return; } if (dest === "yard") { S.dest = "yard"; S.machine = null; S.sub = 0; S.stack.length = 0; S.hist = 0; } else { S.dest = dest; S.machine = null; S.sub = 0; push("dest:" + dest); } render(); }
function openMachine(id){ S.machine = id; S.sub = 0; if (S.dest === "yard") { push("ent:machine-" + id); } render(); }
function openSub(n){ S.sub = n; push("sub:" + n); render(); }
function salvage(){ var d = S.data; d.scrap += 5; d.storeUnits += 5; d.pulses += 1; if (d.pulses >= 6 && d.tutorial <= 1) { d.tutorial = 2; } flash("Cutting pulse recharging"); }
function repair(){ var d = S.data; if (d.scrap < 30) { flash("Need 30 scrap " + U.mid + " have " + d.scrap); return; } d.scrap -= 30; d.drone = true; d.tutorial = 3; }
function bpName(b){ return b === "furnace" ? "Furnace" : (b === "wireMill" ? "Wire mill" : "Scrap sorter"); }
function bpCost(b){ return b === "furnace" ? "20 scrap " + U.mid + " 5 ferrous" : (b === "wireMill" ? "20 scrap " + U.mid + " 5 wire" : "20 scrap"); }
function place(){ var d = S.data; var cost = S.blueprint === "sorter" ? 20 : 25; if (d.scrap < cost) { flash("Need " + cost + " scrap " + U.mid + " have " + d.scrap); return; } d.scrap -= cost; d.storeUnits = Math.max(0, d.storeUnits - cost); d.machines.push({ id: d.machines.length + 1, n: bpName(S.blueprint), tile: S.ghost, lvl: 1, cyc: "4.00s", rate: "0.00", max: "0.25", pw: "1 unit", need: "2 Scrap", next: "Needs 2 scrap, which nothing in the yard", up: "4.00s \u2192 3.80s", price: 30 }); S.blueprint = null; S.machine = null; S.dest = "yard"; S.stack.length = 0; S.hist = 0; if (d.tutorial <= 6) { d.tutorial = 4; } }
function sell(res){ var q = SELL_M[res][0], cr = SELL_M[res][1]; var d = S.data; var row = null; for (var i = 0; i < d.rows.length; i++) { if (d.rows[i][0] === res) { row = d.rows[i]; } } if (!row || row[1] < q) { flash("Need " + q + " units " + U.mid + " have " + (row ? row[1] : 0)); return; } row[1] -= q; d.storeUnits = Math.max(0, d.storeUnits - q); d.credits += cr; flash("Sold " + q + " " + res + " " + U.mid + " +" + cr + " credits"); }
function upgrade(branch, price){ var d = S.data; if (d.credits < price) { flash("Need " + price + " credits " + U.mid + " have " + d.credits); return; } d.credits -= price; for (var i = 0; i < d.machines.length; i++) { if (d.machines[i].id === S.machine) { d.machines[i].lvl += 1; d.machines[i].chosen = branch; } } flash("Upgraded " + branch); }
function buyNode(i){ var d = S.data; var cost = NODES[i][2]; if (d.data < cost) { flash("Need " + cost + " Data " + U.mid + " have " + d.data); return; } d.data -= cost; if (d.known.indexOf(i) < 0) { d.known.push(i); } }
function chipMax(){ var w = window.innerWidth; return w < 380 ? 3 : (w < 600 ? 4 : 7); }
function have(n){ var r = S.data.rows; for (var i = 0; i < r.length; i++) { if (r[i][0] === n) { return r[i][1]; } } return 0; }
function chipList(){ var d = S.data; var out = [["Scrap", d.scrap]]; if (have("Ferrous")) { out.push(["Ferrous", have("Ferrous")]); } out.push(["Credits", d.credits]); out.push(["Store", d.storeUnits + "/" + d.capacity]); ["Nonferrous", "Wire", "Plates", "Circuits", "Data"].forEach(function(n){ if (have(n)) { out.push([n, have(n)]); } }); return out.slice(0, chipMax()); }
function renderBand(){ var h = "<div class=" + QA + "chips" + QA + ">"; var cs = chipList(); for (var i = 0; i < cs.length; i++) { h += "<span class=" + QA + "chip" + QA + ">" + cs[i][0] + " <b>" + cs[i][1] + "</b></span>"; } h += "</div>"; h += "<div class=" + QA + "cluster" + QA + ">"; var big = S.settings.textScale >= 1.5; h += btn("tgl-sound", S.settings.muted ? (big ? "\u2717" : "Sound ?") : (big ? "\u2713" : "Sound \u2713"), null, null, false, function(){ S.settings.muted = !S.settings.muted; }); h += btn("tgl-scale", "A " + S.settings.textScale, null, null, false, function(){ var st = [1, 1.25, 1.5, 2]; S.settings.textScale = st[(st.indexOf(S.settings.textScale) + 1) % st.length]; document.documentElement.style.setProperty("--ts", String(S.settings.textScale)); }); h += btn("tgl-motion", "MOTION", S.settings.reducedMotion ? "on" : "off", S.settings.reducedMotion ? "on" : null, false, function(){ S.settings.reducedMotion = !S.settings.reducedMotion; }); h += "</div>"; el("band").innerHTML = h; }
function renderCard(){ if (!S.started) { el("card").innerHTML = ""; return; } var d = S.data; var p = primarySpec(); var h = "<span class=" + QA + "p" + QA + ">Next: " + p.v + "</span>"; if (window.innerHeight >= 460) { var n = "Drones " + (d.drone ? 5 : 0) + " " + U.mid + " Power 8 " + U.mid + " " + d.power + " " + U.mid + " 100 %"; if (S.blueprint !== null) { n += " " + U.mid + " waits " + (S.blueprint === "sorter" ? 20 : 25) + " scrap " + U.mid + " have " + d.scrap; } h += "<span class=" + QA + "s" + QA + ">" + n + "</span>"; } el("card").innerHTML = h; }
function renderNav(){ if (!S.started) { el("nav").innerHTML = ""; return; } var h = ""; var slots = [["yard", "Yard"], ["build", "Build"], ["store", "Store"], ["research", "Research"], ["menu", "Menu"]]; for (var i = 0; i < slots.length; i++) { var k = slots[i][0], label = slots[i][1], idn = "nav-" + k; if (k === "research" && S.data.data < 1 && S.data.known.length === 0) { h += lock(idn, label, "Needs 1 Data"); continue; } h += btn(idn, label, null, S.dest === k ? "on" : null, false, (function(nm){ return function(){ go(nm); }; })(k)); } el("nav").innerHTML = h; }
function machineOf(){ for (var i = 0; i < S.data.machines.length; i++) { if (S.data.machines[i].id === S.machine) { return S.data.machines[i]; } } return null; }
function forkShown(){ var m = machineOf(); return !!m && S.dest === "yard" && S.sub === 0 && m.price > 0; }
function primarySpec(){ var d = S.data; if (d.rows.length) { var s = SELL_M.Ferrous; return { v: "Sell Ferrous", c: s[0] + " units " + U.mid + " +" + s[1] + " credits", dis: false, fn: function(){ sell("Ferrous"); } }; } if (d.tutorial <= 1) { return { v: "Salvage", c: null, dis: false, fn: salvage }; } if (d.tutorial === 2) { return { v: "Repair drone", c: "30 scrap", dis: d.scrap < 30, fn: repair }; } if (d.machines.length === 0 && d.scrap >= 20) { return { v: "Build Scrap sorter", c: "20 scrap", dis: false, fn: function(){ S.blueprint = "sorter"; S.ghost = 8; place(); } }; } if (d.machines.length === 0) { return { v: "Salvage", c: null, dis: false, fn: salvage }; } if (d.links === 0) { return { v: "Connect sorter to the dock", c: null, dis: false, fn: function(){ S.data.links = 2; } }; } return { v: "Add drone", c: "45 credits", dis: d.credits < 45, fn: function(){ S.data.credits += 45; } }; }
function renderAction(){ var h = ""; if (!S.started) { h += btn("gate-begin", "Begin recovery", null, "p", false, function(){ S.started = true; }); h += btn("tgl-sound-g", "Sound \u2713", null, null, false, function(){ S.settings.muted = !S.settings.muted; }); el("action").innerHTML = h; return; } if (S.blueprint !== null) { h += btn("build-cancel", "Cancel", null, null, false, function(){ S.blueprint = null; }); h += btn("action-primary", "Place " + bpName(S.blueprint), bpCost(S.blueprint), "p", S.data.scrap < (S.blueprint === "sorter" ? 20 : 25), place); h += btn("build-next", "Next", null, null, false, function(){ S.blueprint = S.blueprint === "sorter" ? "furnace" : "sorter"; }); el("action").innerHTML = h; return; } if (forkShown()) { var m = machineOf(); var p1 = m.price, p2 = m.price + 10; h += btn("fork-draw", "Upgrade Less power", String(p1) + " credits", "p", S.data.credits < p1, function(){ upgrade("Less power", p1); }); h += btn("fork-speed", "Upgrade Faster batches", String(p2) + " credits", null, S.data.credits < p2, function(){ upgrade("Faster batches", p2); }); el("action").innerHTML = h; return; } var p = primarySpec(); h += btn("action-primary", p.v, p.c, "p", !!p.dis, p.fn); el("action").innerHTML = h; }
function diamond(g, x, y, c){ g.strokeStyle = c; g.lineWidth = 1; g.beginPath(); g.moveTo(x, y - 10); g.lineTo(x + 18, y); g.lineTo(x, y + 10); g.lineTo(x - 18, y); g.closePath(); g.stroke(); }
function renderWorld(){ var cv = el("cv"); var box = el("world").getBoundingClientRect(); if (!box.width) { return; } var dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1)); cv.width = Math.round(box.width * dpr); cv.height = Math.round(box.height * dpr); var g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = "#0e1726"; g.fillRect(0, 0, box.width, box.height); var t; for (t = 0; t < 12; t++) { var p = tilePt(t, box); diamond(g, p.x, p.y, "#22384a"); } for (t = 0; t < S.data.machines.length; t++) { var m = S.data.machines[t]; var q = tilePt(m.tile, box); g.fillStyle = (m.rate === "0.00") ? "#c9713a" : "#5fd8e8"; g.fillRect(q.x - 14, q.y - 12, 28, 24); g.fillStyle = "#0b1220"; g.font = "10px ui-monospace,Consolas,monospace"; g.fillText(String(m.id), q.x - 3, q.y + 3); } if (S.blueprint !== null) { var r = tilePt(S.ghost, box); g.strokeStyle = "#ffb765"; g.lineWidth = 2; g.strokeRect(r.x - 16, r.y - 14, 32, 28); } if (!S.data.machines.length) { var wq = tilePt(2, box); g.strokeStyle = "#8a7ad8"; g.lineWidth = 2; g.beginPath(); g.arc(wq.x, wq.y, 12, 0, 6.283); g.stroke(); } }
